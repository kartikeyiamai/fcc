# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms/schema/sveltia-cms.json

# https://docs.sveltia.com/cms/guides/deployment/deployment-to-aws-amplify

# FCC CMS Branding
app_title: FCC CMS

logo:
  src: /FCC-Logo-main.png
  show_in_header: true

backend:
  name: github
  repo: kartikeyiamai/fcc
  branch: main
  skip_ci: true
  auth_methods:
    - oauth
  # OAuth broker: validates Microsoft session then returns GitHub token via postMessage.
  # For local development: http://localhost:3000/api/cms-auth
  # For production: https://<your-domain>/api/cms-auth
  base_url: https://main.d2fqkki8q9kcbn.amplifyapp.com/api/cms-auth
  auth_endpoint: auth

media_folder: public/uploads
public_folder: /uploads

site_url: https://main.d2fqkki8q9kcbn.amplifyapp.com
display_url: https://main.d2fqkki8q9kcbn.amplifyapp.com

collections:
  - name: site_settings
    label: Site Settings
    files:
      - name: site_settings
        label: Site Settings
        file: public/data/site-settings.json
        fields:
          - { label: Site Title, name: site_title, widget: string }
          - { label: Site Description, name: site_description, widget: text }
          - { label: Brand Name, name: brand_name, widget: string }
          - { label: Brand Tagline, name: brand_tagline, widget: string }
          - { label: Brand Mark, name: brand_mark, widget: string }
          - { label: Contact Email, name: contact_email, widget: string }
          - { label: Contact Phone, name: contact_phone, widget: string }
          - { label: Contact Phone Href, name: contact_phone_href, widget: string }
          - label: Address Lines
            name: address_lines
            widget: list
            field: { label: Line, name: line, widget: string }
          - { label: Member CTA Label, name: member_cta_label, widget: string }
          - { label: Member CTA Href, name: member_cta_href, widget: string }
          - label: Social Links
            name: social
            widget: list
            fields:
              - { label: Label, name: label, widget: string }
              - { label: URL, name: href, widget: string }
              - { label: Icon Text, name: icon, widget: string }
          - { label: Footer Blurb, name: footer_blurb, widget: text }
          - { label: Footer Copyright, name: footer_copyright, widget: string }
          - { label: Footer Note, name: footer_note, widget: string }
          - { label: Newsletter Placeholder, name: newsletter_placeholder, widget: string }
          - label: Navigation
            name: navigation
            widget: list
            fields:
              - { label: Label, name: label, widget: string }
              - { label: Href, name: href, widget: string }
              - label: Active Match Paths
                name: match
                widget: list
                field: { label: Path, name: path, widget: string }
                required: false
              - label: Children
                name: children
                widget: list
                required: false
                fields:
                  - { label: Label, name: label, widget: string }
                  - { label: Href, name: href, widget: string }
                  - { label: Small Text, name: small, widget: string, required: false }
          - label: Footer Columns
            name: footer_columns
            widget: list
            fields:
              - { label: Title, name: title, widget: string }
              - label: Links
                name: links
                widget: list
                fields:
                  - { label: Label, name: label, widget: string }
                  - { label: Href, name: href, widget: string }

  - name: homepage
    label: Homepage
    files:
      - name: homepage
        label: Homepage
        file: public/data/homepage.json
        fields:
          - label: Hero
            name: hero
            widget: object
            fields:
              - { label: Badge, name: badge, widget: string }
              - { label: Heading Before Emphasis, name: heading_before, widget: string }
              - { label: Heading Emphasis, name: heading_emphasis, widget: string }
              - { label: Heading After Emphasis, name: heading_after, widget: string }
              - { label: Description, name: description, widget: text }
              - { label: Primary CTA Label, name: primary_cta_label, widget: string }
              - { label: Primary CTA Href, name: primary_cta_href, widget: string }
              - { label: Secondary CTA Label, name: secondary_cta_label, widget: string }
              - { label: Secondary CTA Href, name: secondary_cta_href, widget: string }
              - label: Trust Stats
                name: trust
                widget: list
                fields:
                  - { label: Value, name: value, widget: string }
                  - { label: Label, name: label, widget: string }
          - label: Stats
            name: stats
            widget: list
            fields:
              - { label: Value, name: value, widget: string }
              - { label: Suffix, name: suffix, widget: string, required: false }
              - { label: Label, name: label, widget: string }
              - { label: Bar Width, name: bar, widget: string }
          - label: About Teaser
            name: about_teaser
            widget: object
            fields:
              - { label: Eyebrow, name: eyebrow, widget: string }
              - { label: Heading, name: heading, widget: string }
              - { label: Lead, name: lead, widget: text }
              - { label: Primary CTA Label, name: primary_cta_label, widget: string }
              - { label: Primary CTA Href, name: primary_cta_href, widget: string }
              - { label: Secondary CTA Label, name: secondary_cta_label, widget: string }
              - { label: Secondary CTA Href, name: secondary_cta_href, widget: string }
          - label: Committees Section
            name: committees_section
            widget: object
            fields:
              - { label: Eyebrow, name: eyebrow, widget: string }
              - { label: Heading, name: heading, widget: string }
              - { label: Lead, name: lead, widget: text }
              - { label: CTA Label, name: cta_label, widget: string }
              - { label: CTA Href, name: cta_href, widget: string }
          - label: How We Work
            name: how_we_work
            widget: object
            fields:
              - { label: Eyebrow, name: eyebrow, widget: string }
              - { label: Heading, name: heading, widget: string }
              - label: Steps
                name: steps
                widget: list
                fields:
                  - { label: Title, name: title, widget: string }
                  - { label: Description, name: description, widget: text }
          - label: Policy Section
            name: policy_section
            widget: object
            fields:
              - { label: Eyebrow, name: eyebrow, widget: string }
              - { label: Heading, name: heading, widget: string }
              - { label: Lead, name: lead, widget: text }
              - { label: CTA Label, name: cta_label, widget: string }
              - { label: CTA Href, name: cta_href, widget: string }
          - label: Events Section
            name: events_section
            widget: object
            fields:
              - { label: Eyebrow, name: eyebrow, widget: string }
              - { label: Heading, name: heading, widget: string }
              - { label: Lead, name: lead, widget: text }
              - { label: CTA Label, name: cta_label, widget: string }
              - { label: CTA Href, name: cta_href, widget: string }
              - label: Flagship Event
                name: flagship
                widget: object
                fields:
                  - { label: Label, name: label, widget: string }
                  - { label: Title, name: title, widget: string }
                  - { label: Description, name: description, widget: text }
                  - { label: Location, name: location, widget: string }
                  - { label: URL, name: href, widget: string }
                  - { label: CTA Label, name: cta_label, widget: string }
          - label: Research Section
            name: research_section
            widget: object
            fields:
              - { label: Eyebrow, name: eyebrow, widget: string }
              - { label: Heading, name: heading, widget: string }
              - { label: CTA Label, name: cta_label, widget: string }
              - { label: CTA Href, name: cta_href, widget: string }
          - label: Members Section
            name: members_section
            widget: object
            fields:
              - { label: Eyebrow, name: eyebrow, widget: string }
              - { label: Heading, name: heading, widget: string }
              - { label: Lead, name: lead, widget: text }
              - { label: CTA Label, name: cta_label, widget: string }
              - { label: CTA Href, name: cta_href, widget: string }
          - label: Bottom CTA
            name: cta
            widget: object
            fields:
              - { label: Eyebrow, name: eyebrow, widget: string, default: "Membership & partnership" }
              - { label: Heading, name: heading, widget: string, default: "Have a seat at the table where fintech policy is shaped." }
              - { label: Description, name: description, widget: text, default: "Join FCC as a member, or partner with us on events, research and industry programmes." }
              - { label: Primary CTA Label, name: primary_cta_label, widget: string, default: "Apply for membership" }
              - { label: Primary CTA Href, name: primary_cta_href, widget: string, default: "/apply-membership" }
              - { label: Secondary CTA Label, name: secondary_cta_label, widget: string, default: "Partner with us" }
              - { label: Secondary CTA Href, name: secondary_cta_href, widget: string, default: "/apply-partnership" }
              - label: Benefits
                name: benefits
                widget: list
                default:
                  - "Direct input into representations to regulators"
                  - "A seat on sector committees with industry peers"
                  - "Complimentary passes to FCC and IAMAI conferences"
                  - "Members-only roundtables and every FCC report"
                field: { label: Benefit, name: benefit, widget: string }

  - name: about
    label: About FCC
    files:
      - name: about
        label: About FCC
        file: public/data/about.json
        fields:
          - label: Hero
            name: hero
            widget: object
            fields:
              - { label: Title, name: title, widget: string }
              - { label: Description, name: description, widget: text }
          - label: Overview
            name: overview
            widget: object
            fields:
              - { label: Eyebrow, name: eyebrow, widget: string }
              - { label: Heading, name: heading, widget: string }
              - label: Paragraphs
                name: paragraphs
                widget: list
                field: { label: Paragraph, name: paragraph, widget: text }
          - { label: Vision, name: vision, widget: text }
          - { label: Mission, name: mission, widget: text }
          - label: Pillars
            name: pillars
            widget: list
            fields:
              - { label: Title, name: title, widget: string }
              - { label: Description, name: description, widget: text, required: false }
              - label: Items
                name: items
                widget: list
                required: false
                field: { label: Item, name: item, widget: string }
          - label: Journey
            name: journey
            widget: object
            fields:
              - { label: Heading, name: heading, widget: string }
              - { label: Lead, name: lead, widget: text }
              - label: Milestones
                name: milestones
                widget: list
                fields:
                  - { label: Year, name: year, widget: number, value_type: int }
                  - { label: Title, name: title, widget: string }
                  - { label: Description, name: description, widget: text }
          - label: Governing Council
            name: council
            widget: object
            fields:
              - { label: Heading, name: heading, widget: string }
              - { label: Lead, name: lead, widget: text }
              - label: Members
                name: members
                widget: list
                fields:
                  - { label: Name, name: name, widget: string }
                  - { label: Role, name: role, widget: string }
          - label: Bottom CTA
            name: cta
            widget: object
            fields:
              - { label: Eyebrow, name: eyebrow, widget: string, default: "Membership & partnership" }
              - { label: Heading, name: heading, widget: string, default: "Have a seat at the table where fintech policy is shaped." }
              - { label: Description, name: description, widget: text, default: "Join FCC as a member, or partner with us on events, research and industry programmes." }
              - { label: Primary CTA Label, name: primary_cta_label, widget: string, default: "Apply for membership" }
              - { label: Primary CTA Href, name: primary_cta_href, widget: string, default: "/apply-membership" }
              - { label: Secondary CTA Label, name: secondary_cta_label, widget: string, default: "Partner with us" }
              - { label: Secondary CTA Href, name: secondary_cta_href, widget: string, default: "/apply-partnership" }
              - label: Benefits
                name: benefits
                widget: list
                default:
                  - "Direct input into representations to regulators"
                  - "A seat on sector committees with industry peers"
                  - "Complimentary passes to FCC and IAMAI conferences"
                  - "Members-only roundtables and every FCC report"
                field: { label: Benefit, name: benefit, widget: string }

  - name: members
    label: Members
    files:
      - name: members
        label: Members
        file: public/data/members.json
        fields:
          - label: Page
            name: page
            widget: object
            fields:
              - { label: Title, name: title, widget: string }
              - { label: Description, name: description, widget: text }
          - label: Members
            name: items
            widget: list
            summary: "{{fields.name}}"
            fields:
              - { label: Organization Name, name: name, widget: string }
              - label: Logo
                name: logo
                widget: image
                required: false
                choose_url: false
                media_library:
                  name: aws_s3
              - { label: Logo Filename, name: logo_filename, widget: string, required: false }

  - name: membership_benefits
    label: Membership Benefits
    files:
      - name: membership_benefits
        label: Membership Benefits Page
        file: public/data/membership-benefits.json
        fields:
          - label: Hero
            name: hero
            widget: object
            fields:
              - { label: Title, name: title, widget: string, default: "Membership Benefits" }
              - { label: Description, name: description, widget: text, default: "What your company gets as a member of the Fintech Convergence Council." }
          - label: Why Join Section
            name: why_join
            widget: object
            fields:
              - { label: Eyebrow, name: eyebrow, widget: string, default: "Why join" }
              - { label: Heading, name: heading, widget: string, default: "A seat at the table, and everything around it" }
              - { label: Lead, name: lead, widget: text, default: "Members get a direct line into policy conversations, plus the events, research and network that come with being part of IAMAI." }
              - { label: Primary CTA Label, name: primary_cta_label, widget: string, default: "Apply now" }
              - { label: Primary CTA Href, name: primary_cta_href, widget: string, default: "/apply-membership" }
              - { label: Secondary CTA Label, name: secondary_cta_label, widget: string, default: "See our members" }
              - { label: Secondary CTA Href, name: secondary_cta_href, widget: string, default: "/members" }
              - { label: Card Title, name: card_title, widget: string, default: "FCC", required: false }
              - { label: Card Member Tag, name: card_member_tag, widget: string, default: "MEMBER · 2026", required: false }
              - { label: Card Member Of, name: card_member_of, widget: string, default: "Fintech Convergence Council", required: false }
              - { label: Card Sub Note, name: card_sub_note, widget: string, default: "IAMAI INCLUDED", required: false }
          - label: Benefits Section
            name: benefits_section
            widget: object
            fields:
              - { label: Eyebrow, name: eyebrow, widget: string, default: "Benefits" }
              - { label: Heading, name: heading, widget: string, default: "Seven reasons members join" }
              - label: Reasons List
                name: items
                widget: list
                summary: "{{fields.num}} - {{fields.title}}"
                fields:
                  - { label: Number, name: num, widget: number, value_type: int, min: 1 }
                  - { label: Title, name: title, widget: string }
                  - { label: Description, name: description, widget: text }
              - label: Ready to Join Box
                name: ready_card
                widget: object
                fields:
                  - { label: Title, name: title, widget: string, default: "Ready to join?" }
                  - { label: Subtitle / Link Text, name: subtitle, widget: string, default: "Apply in under two minutes →" }
                  - { label: Href, name: href, widget: string, default: "/apply-membership" }
          - label: Process Section
            name: process_section
            widget: object
            fields:
              - { label: Eyebrow, name: eyebrow, widget: string, default: "Process" }
              - { label: Heading, name: heading, widget: string, default: "How membership works" }
              - { label: Lead / Contact Note, name: lead, widget: text, default: "Questions? Call 022-61766666 or write to swati.s@fintechcouncil.in" }
              - label: Steps
                name: steps
                widget: list
                summary: "{{fields.num}} - {{fields.title}}"
                fields:
                  - { label: Step Number, name: num, widget: string }
                  - { label: Title, name: title, widget: string }
                  - { label: Description, name: description, widget: text }

  - name: apply_membership
    label: Apply for Membership
    files:
      - name: apply_membership
        label: Apply for Membership Page
        file: public/data/apply-membership.json
        fields:
