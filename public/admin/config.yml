                fields:
                  - { label: Heading, name: heading, widget: string, default: "Need help?" }
                  - { label: Lead Text, name: lead, widget: string, default: "Call", required: false }
                  - { label: Phone, name: phone, widget: string, default: "022-61766666" }
                  - { label: Phone Href, name: phone_href, widget: string, default: "tel:02261766666" }
                  - { label: Email, name: email, widget: string, default: "info@fintechcouncil.in" }

