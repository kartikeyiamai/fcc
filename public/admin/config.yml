              - { label: Title, name: title, widget: string, default: "Apply for Membership" }
              - { label: Description, name: description, widget: text, default: "FCC works with all its members to promote the growth of the fintech industry. Tell us about your company and we'll get in touch." }
          - label: Sidebar
