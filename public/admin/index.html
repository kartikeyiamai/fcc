<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>FCC CMS</title>
    <link rel="icon" type="image/png" href="/FCC-tab-logo-main.png" />
    <link rel="shortcut icon" href="/FCC-tab-logo-main.png" />
    <style>
      /* =========================================================================
         CMS Panel Divider & Scrollbar Enhancements
         Provides both:
         1. Comfortable 14px scrollbars for easy scrolling
         2. An 8px horizontal resizer with col-resize cursor that does NOT overlap the scrollbar
         ========================================================================= */

      /* 1. Dedicated, easy-to-grab 8px horizontal resizer between Edit and Preview */
      .sui.resizable-handle.horizontal,
      .resizable-handle.horizontal,
      .resizable-handle[class*="horizontal"] {
        width: 8px !important;
        flex: 0 0 8px !important;
        cursor: col-resize !important;
        pointer-events: auto !important;
        position: relative !important;
        z-index: 5 !important;
        background-color: var(--sui-secondary-background-color, #f1f3f5) !important;
        border-inline: 1px solid var(--area-border, #e5e7eb) !important;
        transition: background-color 150ms ease !important;
      }

      .sui.resizable-handle.horizontal:hover,
      .resizable-handle.horizontal:hover,
      .sui.resizable-handle.horizontal.dragging,
      .resizable-handle.horizontal.dragging {
        background-color: var(--sui-primary-accent-color-translucent-light, #fee2e2) !important;
      }

      /* 2. Confine the resizer hitbox strictly within the 8px divider so it NEVER overlaps the scrollbar */
      .sui.resizable-handle.horizontal::before,
      .resizable-handle.horizontal::before,
      .resizable-handle[class*="horizontal"]::before {
        display: block !important;
        content: "" !important;
        position: absolute !important;
        inset-block: 0 !important;
        inset-inline: 0 !important; /* Bounded strictly within the 8px handle - no bleed into scrollbar */
        cursor: col-resize !important;
        pointer-events: auto !important;
        z-index: 2 !important;
      }

      /* 3. Keep any center button (such as swap button) clickable */
      .resizable-handle.horizontal button,
      .sui.resizable-handle.horizontal button {
        pointer-events: auto !important;
        cursor: pointer !important;
        z-index: 3 !important;
      }

      /* 4. Wide, easy-to-grab 14px scrollbar across CMS panels */
      ::-webkit-scrollbar {
        width: 14px !important;
        height: 14px !important;
      }

      ::-webkit-scrollbar-track {
        background: #f8fafc !important;
        border-left: 1px solid #e2e8f0 !important;
      }

      ::-webkit-scrollbar-thumb {
        background-color: #cbd5e1 !important;
        border-radius: 7px !important;
        border: 3px solid #f8fafc !important;
      }

      ::-webkit-scrollbar-thumb:hover {
        background-color: #94a3b8 !important;
      }

      ::-webkit-scrollbar-thumb:active {
        background-color: #64748b !important;
      }

      /* Firefox & standard scrollbar support */
      * {
        scrollbar-width: auto !important;
        scrollbar-color: #cbd5e1 #f8fafc !important;
      }
    </style>
  </head>
  <body style="margin: 0; background: #f9fafb;">
    <div id="cms-loading" style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f9fafb; color: #374151;">
      <div style="font-weight: 800; font-size: 1.75rem; color: #BF1A1F; margin-bottom: 6px; letter-spacing: -0.5px;">FCC CMS</div>
      <div style="font-size: 0.875rem; color: #6b7280; margin-bottom: 20px;">Fintech Convergence Council</div>
      <div style="width: 36px; height: 36px; border: 3px solid #e5e7eb; border-top-color: #BF1A1F; border-radius: 50%; animation: spin 0.8s linear infinite;"></div>
      <style>@keyframes spin { to { transform: rotate(360deg); } }</style>
    </div>

    <script>
      (function () {
        // =========================================================================
        // Defense-in-depth: Verify Microsoft Entra session before loading Sveltia CMS.
        // Static assets in public/admin served by CloudFront/S3 may bypass SSR middleware.
        // Unauthenticated visitors are immediately redirected to /cms-login.
        // =========================================================================
        fetch('/api/auth/session', { cache: 'no-store' })
          .then(function (res) {
            if (!res.ok) throw new Error('Session check failed');
            return res.json();
          })
          .then(function (session) {
            if (!session || !session.user) {
              console.log('[CMS_AUTH_DIAGNOSTIC] NO_SESSION_REDIRECTING_TO_LOGIN');
              var target = '/cms-login?callbackUrl=' + encodeURIComponent(window.location.href);
              window.location.replace(target);
              return;
            }

            console.log('[CMS_AUTH_DIAGNOSTIC] SESSION_ACTIVE_PREPARING_CMS');

            // Securely retrieve AWS S3 credentials and populate into Sveltia prefs
            // before loading the Sveltia script so Sveltia reads them directly on startup.
            // Also enforce closeOnSave = false so saving an entry keeps the user on the current entry.
            return fetch('/api/cms-s3-credentials', { credentials: 'include', cache: 'no-store' })
              .then(function (res) {
                if (res.ok) {
                  return res.json();
                }
                return null;
              })
              .then(function (data) {
                try {
                  var prefs = JSON.parse(localStorage.getItem('sveltia-cms.prefs') || '{}');
                  if (!prefs || typeof prefs !== 'object') prefs = {};
                  prefs.closeOnSave = false;
                  if (data && data.secretAccessKey) {
                    if (!prefs.apiKeys || typeof prefs.apiKeys !== 'object') prefs.apiKeys = {};
                    prefs.apiKeys.aws_s3 = data.secretAccessKey;
                  }
                  localStorage.setItem('sveltia-cms.prefs', JSON.stringify(prefs));
                } catch (e) {
                  console.warn('[CMS_PREFS] Failed to store preferences into localStorage:', e);
                }
                initSveltiaCMS();
              })
              .catch(function (err) {
                console.warn('[CMS_S3] Could not fetch S3 credentials:', err);
                try {
                  var fallbackPrefs = JSON.parse(localStorage.getItem('sveltia-cms.prefs') || '{}');
                  if (!fallbackPrefs || typeof fallbackPrefs !== 'object') fallbackPrefs = {};
                  fallbackPrefs.closeOnSave = false;
                  localStorage.setItem('sveltia-cms.prefs', JSON.stringify(fallbackPrefs));
                } catch (e) {}
                initSveltiaCMS();
              });
          })
          .catch(function () {
            console.log('[CMS_AUTH_DIAGNOSTIC] SESSION_ERROR_REDIRECTING_TO_LOGIN');
            var target = '/cms-login?callbackUrl=' + encodeURIComponent(window.location.href);
            window.location.replace(target);
          });

        function initSveltiaCMS() {
          // Safe diagnostic listener for Sveltia token handoff
          window.addEventListener('message', function (event) {
            if (event.origin !== window.location.origin) return;
            if (typeof event.data === 'string' && event.data.indexOf('authorization:github:success') === 0) {
              console.log('[CMS_AUTH_DIAGNOSTIC] SVELTIA_AUTH_SUCCESS_RECEIVED');
            }
          }, false);

          // =========================================================================
          // Intercept Sveltia's Profile Menu "Sign Out" Action
          // =========================================================================
          var isSigningOut = false;

          function isSignOutElement(node) {
            if (!node || node.nodeType !== 1) return false;

            var text = (node.textContent || '').trim().toLowerCase();
            var label = (node.getAttribute && node.getAttribute('aria-label') || '').trim().toLowerCase();
            var title = (node.getAttribute && node.getAttribute('title') || '').trim().toLowerCase();
            var combined = text + ' ' + label + ' ' + title;

            // Strict exclusion: Do not intercept Settings, Preferences, Shortcuts, or Help
            if (
              combined.indexOf('setting') !== -1 ||
              combined.indexOf('shortcut') !== -1 ||
              combined.indexOf('preference') !== -1 ||
              combined.indexOf('help') !== -1
            ) {
              return false;
            }

            // Exact match for sign out / log out
            if (
              text === 'sign out' ||
              text === 'sign-out' ||
              text === 'log out' ||
              text === 'logout' ||
              label === 'sign out' ||
              label === 'log out'
            ) {
              return true;
            }

            // Role menuitem, button, link, or listitem checking for leading "sign out" or "log out"
            var role = (node.getAttribute && node.getAttribute('role') || node.tagName.toLowerCase());
            if (role === 'menuitem' || role === 'button' || role === 'a' || role === 'li') {
              if (/^(sign|log)\s*out\b/i.test(text) || /^(sign|log)\s*out\b/i.test(label)) {
                return true;
              }
            }

            return false;
          }

          document.addEventListener(
            'click',
            function (event) {
              var path = event.composedPath ? event.composedPath() : [];
              if (!path || path.length === 0) {
                var curr = event.target;
                while (curr && curr !== document) {
                  path.push(curr);
                  curr = curr.parentElement;
                }
              }

              for (var i = 0; i < path.length; i++) {
                if (isSignOutElement(path[i])) {
                  // Intercept before Sveltia's internal GitHub-only logout fires
                  event.preventDefault();
                  event.stopPropagation();
                  event.stopImmediatePropagation();

                  if (isSigningOut) return;
                  isSigningOut = true;

                  console.log('[CMS_AUTH_DIAGNOSTIC] SVELTIA_SIGNOUT_INTERCEPTED');

                  // 1. Purge Sveltia CMS credentials, S3 secret key, and auto-auth flag
                  try {
                    localStorage.removeItem('sveltia-cms.user');
                    sessionStorage.removeItem('fcc_auto_auth');
                    var prefs = JSON.parse(localStorage.getItem('sveltia-cms.prefs') || '{}');
                    if (prefs && prefs.apiKeys && prefs.apiKeys.aws_s3) {
                      delete prefs.apiKeys.aws_s3;
                      localStorage.setItem('sveltia-cms.prefs', JSON.stringify(prefs));
                    }
                  } catch (e) {}

                  // 2. Navigate to combined sign-out route (Auth.js + Microsoft Entra logout)
                  window.location.href = '/cms-signout';
                  return;
                }
              }
            },
            true // useCapture = true: runs before element-level click listeners
          );

          // =========================================================================
          // One-Click Login Coordinator
          // =========================================================================
          var autoAuth = false;
          try {
            autoAuth = sessionStorage.getItem('fcc_auto_auth') === '1';
          } catch (e) {}

          var hasTriggered = false;
          var observer = null;
          var pollTimer = null;
          var attempts = 0;
          var maxAttempts = 450; // Poll for up to 45 seconds (450 * 100ms) to allow CDN script load

          function findGitHubButton() {
            var candidates = Array.from(
              document.querySelectorAll('button, [role="button"], a, input[type="button"], input[type="submit"]')
            );

            // Priority 1: Button whose text, label or title contains both 'github' and ('sign in' or 'login')
            for (var i = 0; i < candidates.length; i++) {
              var el = candidates[i];
              var text = (el.textContent || '').trim().toLowerCase();
              var label = (el.getAttribute('aria-label') || '').trim().toLowerCase();
              var title = (el.getAttribute('title') || '').trim().toLowerCase();
              var combined = text + ' ' + label + ' ' + title;

              if (
                combined.indexOf('github') !== -1 &&
                (combined.indexOf('sign in') !== -1 ||
                  combined.indexOf('sign-in') !== -1 ||
                  combined.indexOf('log in') !== -1 ||
                  combined.indexOf('login') !== -1)
              ) {
                return el;
              }
            }

            // Priority 2: Any button or role=button whose text or label contains 'github'
            for (var j = 0; j < candidates.length; j++) {
              var el2 = candidates[j];
              var text2 = (el2.textContent || '').trim().toLowerCase();
              var label2 = (el2.getAttribute('aria-label') || '').trim().toLowerCase();
              var title2 = (el2.getAttribute('title') || '').trim().toLowerCase();
              var combined2 = text2 + ' ' + label2 + ' ' + title2;

              if (combined2.indexOf('github') !== -1) {
                return el2;
              }
            }

            // Priority 3: Button containing an SVG with GitHub/Octocat icon
            var svgs = document.querySelectorAll('button svg, [role="button"] svg');
            for (var k = 0; k < svgs.length; k++) {
              var svg = svgs[k];
              var svgHtml = (svg.outerHTML || '').toLowerCase();
              if (svgHtml.indexOf('github') !== -1 || svgHtml.indexOf('octocat') !== -1) {
                var parent = svg.closest('button, [role="button"], a');
                if (parent) return parent;
              }
            }

            return null;
          }

          function cleanup() {
            if (observer) {
              try { observer.disconnect(); } catch (e) {}
              observer = null;
            }
            if (pollTimer) {
              clearInterval(pollTimer);
              pollTimer = null;
            }
          }

          function tryTriggerAuth() {
            if (!autoAuth || hasTriggered) return;

            var btn = findGitHubButton();
            if (btn) {
              hasTriggered = true;
              cleanup();

              console.log('[CMS_AUTH_DIAGNOSTIC] SVELTIA_LOGIN_BUTTON_FOUND');

              // Programmatically click Sveltia's GitHub sign-in button
              // Sveltia will invoke window.open(authUrl, 'auth', ...) which navigates the already-open 'auth' popup
              btn.click();
              console.log('[CMS_AUTH_DIAGNOSTIC] SVELTIA_LOGIN_BUTTON_CLICKED');

              // Clear the auto-auth flag only after successfully triggering the broker flow
              try {
                sessionStorage.removeItem('fcc_auto_auth');
              } catch (e) {}
            }
          }

          if (autoAuth) {
            console.log('[CMS_AUTH_DIAGNOSTIC] CMS_AUTO_AUTH_STARTED');

            // 1. Check immediately
            tryTriggerAuth();

            // 2. Use MutationObserver to react instantaneously when Sveltia injects DOM
            if (typeof MutationObserver !== 'undefined' && document.documentElement) {
              observer = new MutationObserver(function () {
                tryTriggerAuth();
              });
              observer.observe(document.documentElement, {
                childList: true,
                subtree: true,
              });
            }

            // 3. Fallback bounded polling timer (up to 45s)
            pollTimer = setInterval(function () {
              attempts++;
              tryTriggerAuth();

              if (attempts >= maxAttempts) {
                cleanup();
                if (!hasTriggered) {
                  console.warn('[CMS_AUTH_DIAGNOSTIC] Auto-auth timed out waiting for Sveltia GitHub login button');
                  try {
                    sessionStorage.removeItem('fcc_auto_auth');
                  } catch (e) {}
                }
              }
            }, 100);
          }

          // Dynamically load customized local Sveltia CMS bundle (with mobile promo infobar removed)
          var script = document.createElement('script');
          script.src = '/admin/vendor/sveltia-cms/sveltia-cms.js';
          script.onload = function () {
            // Remove loading screen once Sveltia script has loaded
            var loadingEl = document.getElementById('cms-loading');
            if (loadingEl) {
              setTimeout(function () {
                if (loadingEl && loadingEl.parentNode) {
                  loadingEl.parentNode.removeChild(loadingEl);
                }
              }, 400);
            }
          };
          document.body.appendChild(script);
        }
      })();
    </script>
  </body>
</html>
