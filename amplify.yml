
version: 1

frontend:
  phases:
    preBuild:
      commands:
        # Use Node.js 22 (supported by Amplify SSR)
        - nvm use 22
        - node -v
        - npm -v

        # Install dependencies
        - npm ci --cache .npm --prefer-offline

    build:
      commands:
        # Make required server-side variables available to Next.js SSR
        - env | grep -E '^(AUTH_SECRET|AUTH_URL|AUTH_TRUST_HOST|AUTH_MICROSOFT_ENTRA_ID_ID|AUTH_MICROSOFT_ENTRA_ID_SECRET|AUTH_MICROSOFT_ENTRA_ID_ISSUER|CMS_GITHUB_TOKEN|NEXTAUTH_URL|NEXT_PUBLIC_)' > .env.production || true

        # Build Next.js
        - npm run build

  artifacts:
    baseDirectory: .next
    files:
      - '**/*'

  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
      - .npm/**/*
